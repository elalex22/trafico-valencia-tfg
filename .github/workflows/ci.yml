# CI de la demo: lint y tests (sin los datos completos: los tests que los
# necesitan se saltan solos) y construcción de la imagen Docker con una
# prueba de humo del healthcheck. No publica nada.
name: CI

on:
  push:
    branches: [main, demo-web]
  pull_request:
    branches: [main, demo-web]

permissions:
  contents: read

jobs:
  tests:
    name: ruff y pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Python 3.10, el mismo que el .venv y la imagen Docker, con caché de pip.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-torch-cpu.txt
            requirements-app.txt
            requirements-dev.txt

      # torch solo CPU y torch-geometric (mismo archivo que el Dockerfile), la
      # app y las herramientas de desarrollo. No requirements.txt: osmnx y el
      # resto del pipeline no hacen falta.
      - name: Instalar dependencias
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements-torch-cpu.txt
          pip install -r requirements-app.txt -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest -q -rs

  docker:
    name: imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Construye la imagen sin publicarla; la carga en el daemon local para
      # poder arrancarla. Caché de capas de GitHub Actions.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trafico-valencia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prueba de humo: arranca el contenedor y espera a que su HEALTHCHECK
      # (/_stcore/health) pase a "healthy".
      - name: Arrancar y esperar al healthcheck
        run: |
          docker run -d --name demo -p 8501:8501 trafico-valencia:ci
          for i in $(seq 1 30); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' demo)
            echo "healthcheck: $estado"
            if [ "$estado" = "healthy" ]; then exit 0; fi
            if [ "$estado" = "unhealthy" ]; then break; fi
            sleep 5
          done
          docker logs demo
          exit 1

      - name: Parar el contenedor
        if: always()
        run: docker rm -f demo || true
